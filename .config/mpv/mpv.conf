# mpv — HUD look to match the rest of the desktop.
# Colours live in theme.conf and script-opts/{osc,console}.conf, which
# ~/.config/theme/wallpaper-theme regenerates on every wallpaper change.
include="~~/theme.conf"

# on-screen text (volume, seek, messages) and the OSD progress bar
osd-font='JetBrainsMono Nerd Font'
osd-font-size=24
osd-border-size=1.5
osd-shadow-offset=0
osd-bar-align-y=0.92
osd-bar-h=1.4
osd-bar-w=50
osd-duration=1200
osd-fractions=no
