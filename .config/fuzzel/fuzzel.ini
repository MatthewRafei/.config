# HUD-style launcher: centered, square corners, mono type.
# Colours in [colors] are rewritten by ~/.config/theme/wallpaper-theme.

[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
dpi-aware=auto
prompt="//  "
placeholder=search
terminal=alacritty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=center
width=46
lines=10
tabs=4
horizontal-pad=22
vertical-pad=18
inner-pad=14
line-height=24
letter-spacing=0.5
match-counter=yes
icons-enabled=yes
image-size-ratio=0

[colors]
background=09060bf2
text=9b8ba7ff
prompt=ba86dfff
placeholder=594b63ff
input=f0ecf4ff
match=ba86dfff
selection=201726ff
selection-text=f0ecf4ff
selection-match=ba86dfff
border=ba86df99

[border]
width=1
radius=3
selection-radius=2

[dmenu]
exit-immediately-if-empty=yes
