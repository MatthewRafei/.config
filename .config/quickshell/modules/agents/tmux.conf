# tmux for kept Claude Code sessions (Agents.qml): a private server
# (`tmux -L claude -f this`), so it never touches your own tmux. Kept quiet:
# no status bar, the terminal just looks like Claude. Closing the terminal
# detaches; the bar's agents chip opens it again.
set -g status off
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:extkeys:hyperlinks:clipboard"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
# the window title is the session name, so the bar can find it
set -g set-titles on
set -g set-titles-string "#S"
# when claude exits, the session goes too
set -g remain-on-exit off
set -g exit-empty on
# no tmux keys at all: Ctrl+B belongs to Claude Code (background a command),
# and closing the terminal is how you detach
set -g prefix None
unbind C-b
